slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # Frames/topics from the validated Rower stack. SLAM consumes the gated
    # scan stream so motion-distorted 360-degree scans from in-place turns are
    # never inserted into the map.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_slam
    mode: mapping

    # Solver.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Compact 4x4 m arena. Keep detail while leaving CPU headroom on Raspberry Pi 4.
    resolution: 0.025
    max_laser_range: 8.0
    minimum_time_interval: 0.20
    transform_publish_period: 0.05
    map_update_interval: 1.0
    transform_timeout: 0.50
    tf_buffer_duration: 30.0

    # STL-19P is about 10 Hz. The gate suppresses turn scans; processing every
    # second accepted scan is enough at our mapping speed.
    throttle_scans: 2
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # IMPORTANT: the real robot's encoder odometry is now physically calibrated
    # for straight motion and for left/right turns. The previous failure came
    # from scan matching continuously correcting map->odom so aggressively that
    # the robot pose stayed near the same place in map while the LiDAR geometry
    # moved around it. For map acquisition we therefore use odometry as the
    # authoritative pose and use LiDAR only to paint occupancy.
    use_scan_matching: false
    use_scan_barycenter: false
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.02
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 5.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 1.0

    # Do not let loop-closure optimization move already-built map sections while
    # we are validating the odometry-anchored map. The saved map can later be
    # used with localization (AMCL/Nav2), where scan matching is appropriate.
    do_loop_closing: false
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Kept explicit for slam_toolbox compatibility; these are inactive while
    # use_scan_matching/do_loop_closing are false.
    correlation_search_space_dimension: 0.50
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.10
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.50
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.90
    minimum_distance_penalty: 0.50
    use_response_expansion: true
