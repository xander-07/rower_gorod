slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # Frames/topics from the validated Rower stack. SLAM intentionally consumes
    # the gated scan stream: raw /scan remains available for diagnostics/UI,
    # while motion-distorted scans measured during in-place turns are suppressed.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_slam
    mode: mapping

    # Solver.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Compact arena. Keep useful detail, but leave CPU headroom for the base,
    # LiDAR and local browser dashboard on Raspberry Pi 4.
    resolution: 0.025
    max_laser_range: 8.0
    minimum_time_interval: 0.20
    transform_publish_period: 0.05
    map_update_interval: 2.0
    transform_timeout: 0.50
    tf_buffer_duration: 30.0

    # STL-19P publishes about 10 Hz. Processing every second stable scan (~5 Hz)
    # is sufficient at our low mapping speeds and leaves CPU headroom on the Pi.
    throttle_scans: 2
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Process motion in small increments; straight-line scans are still accepted.
    # During turns the scan gate pauses SLAM input and odometry carries heading;
    # after the chassis settles a fresh undistorted scan resumes scan matching.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.03
    minimum_travel_heading: 0.03
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 5.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 1.0

    # Loop closure is useful in the compact arena.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Scan matcher search windows kept close to slam_toolbox defaults.
    correlation_search_space_dimension: 0.50
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.10
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.50
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.90
    minimum_distance_penalty: 0.50
    use_response_expansion: true
